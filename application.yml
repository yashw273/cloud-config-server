eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      default-zone : http://localhost:8761/eureka/
  instance:
    hostname: localhost

microservice:
  ORDER-SERVICE:
    endpoints:
      endpoint:
        uri: http://ORDER-SERVICE/order/bookOrder
  PAYMENT-SERVICE:
    endpoints:
      endpoint:
        uri: http://PAYMENT-SERVICE/payment/doPayment
